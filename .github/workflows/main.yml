name: Build APK MyRupiah
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Siapkan file
        run: |
          mkdir -p www assets
          f=$(find . -name index.html -not -path "./node_modules/*" -not -path "./android/*" -not -path "./www/*" | head -1)
          if [ ! -f www/index.html ] && [ -n "$f" ]; then cp "$f" www/index.html; fi
          for n in icon-only icon-background icon-foreground; do
            p=$(find . -name "$n.png" -not -path "./node_modules/*" -not -path "./android/*" | head -1)
            if [ -n "$p" ] && [ ! -f assets/$n.png ]; then cp "$p" assets/$n.png; fi
          done
          ls -R www assets
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MyRupiah-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
