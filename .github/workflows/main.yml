name: Build APK MyRupiah
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Siapkan file
        run: |
          mkdir -p www assets
          f=$(find . -name myrupiah-app.html -not -path "./node_modules/*" | head -1)
          test -n "$f" || { echo "myrupiah-app.html tidak ditemukan"; exit 1; }
          cp "$f" www/index.html
          for n in icon-only icon-background icon-foreground; do
            p=$(find . -name "mr-$n.png" -not -path "./node_modules/*" | head -1)
            test -n "$p" || { echo "mr-$n.png tidak ditemukan"; exit 1; }
            cp "$p" assets/$n.png
          done
          ls -R www assets
      - run: npx cap add android
      - name: Izin kamera
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MyRupiah-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
